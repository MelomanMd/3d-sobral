<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Trikot Konfigurator | SOBRAL Custom Studio</title>
  <meta name="description" content="Interaktiver 3D-Trikot- und T-Shirt-Konfigurator. Farben, Schriften, Nummern und Logos in Echtzeit anpassen.">
  <link rel="stylesheet" href="./src/styles/main.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z'/></svg>">
</head>
<body>
  <!-- 1. Top Announcement Bar (sobral.ch style) -->
  <div class="sobral-top-bar">
    <div class="top-bar-left">
      <span class="top-bar-highlight" data-i18n="top_announcement">GROSSE AUSWAHL - TOP MARKEN - PERSÖNLICHE BERATUNG</span>
    </div>
    <div class="top-bar-right">
      <a href="https://sobral.ch/de/kundenportal" target="_blank" rel="noopener" class="top-link" data-i18n="top_portal">Kundenportal</a>
      <a href="https://sobral.ch/de/service" target="_blank" rel="noopener" class="top-link" data-i18n="top_service">Service</a>
      <a href="https://sobral.ch/de/kataloge" target="_blank" rel="noopener" class="top-link" data-i18n="top_catalogs">Kataloge</a>
      <a href="https://sobral.ch/de/ueber-uns" target="_blank" rel="noopener" class="top-link" data-i18n="top_about">Über uns</a>
      <a href="https://sobral.ch/de/kontakt" target="_blank" rel="noopener" class="top-link" data-i18n="top_contact">Kontakt</a>
      <div class="lang-switch-group">
        <button class="lang-btn active" data-lang="de" id="lang-btn-de" title="Deutsch">
          <span class="lang-flag" id="flag-de"></span>
          <span class="lang-code">DE</span>
        </button>
        <button class="lang-btn" data-lang="en" id="lang-btn-en" title="English">
          <span class="lang-flag" id="flag-en"></span>
          <span class="lang-code">EN</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 2. Main Header Navigation -->
  <header class="app-header">
    <div class="brand-group">
      <a href="https://sobral.ch" target="_blank" rel="noopener noreferrer" class="brand-logo-wrap" title="SOBRAL Workwear">
        <img src="/images/sobral-workwear-logo.svg" alt="SOBRAL Workwear" class="brand-logo-img">
      </a>
    </div>

    <!-- Search / Info Bar (sobral.ch style) -->
    <div class="header-search-box">
      <input type="text" class="search-input" placeholder="ICH SUCHE NACH..." data-i18n-placeholder="search_placeholder" readonly>
      <span class="search-icon-svg">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </span>
    </div>

    <!-- Right Header Actions -->
    <div class="header-actions">
      <!-- Undo / Redo -->
      <div class="history-btn-group">
        <button class="history-btn" id="btn-undo" title="Rückgängig (Ctrl + Z)" disabled>
          <span class="btn-icon" id="icon-undo"></span>
          <span class="btn-text" id="undo-text">Rückgängig</span>
        </button>
        <button class="history-btn" id="btn-redo" title="Wiederholen (Ctrl + Y)" disabled>
          <span class="btn-icon" id="icon-redo"></span>
          <span class="btn-text" id="redo-text">Wiederholen</span>
        </button>
      </div>

      <button class="btn-primary-action btn-add-product-main" id="btn-open-add-product" title="Neues Produkt aus Fotos erstellen">
        <span class="btn-icon" id="icon-add-prod"></span>
        <span id="add-prod-label">+ Neues Produkt</span>
      </button>
      <button class="btn-secondary-action" id="btn-open-import" title="Projekt laden / Vorlage wählen">
        <span class="btn-icon" id="icon-import"></span>
        <span id="import-label">Laden</span>
      </button>
      <button class="btn-secondary-action" id="btn-randomize" title="Zufälliges Design generieren">
        <span class="btn-icon" id="icon-shuffle"></span>
        <span id="randomize-label">Zufall</span>
      </button>
      <button class="btn-primary-action" id="btn-open-export" title="Spezifikation ansehen & 3D-Mockup herunterladen">
        <span class="btn-icon" id="icon-download"></span>
        <span id="export-label">3D-Mockup</span>
      </button>
    </div>
  </header>

  <!-- 3. Sobral Orange Category Navigation Bar -->
  <nav class="sobral-category-bar">
    <div class="cat-bar-container">
      <a href="https://sobral.ch/de/arbeitskleidung" target="_blank" rel="noopener" class="cat-link active" data-i18n="nav_workwear">Arbeitskleidung</a>
      <a href="https://sobral.ch/de/arbeitsschuhe" target="_blank" rel="noopener" class="cat-link" data-i18n="nav_shoes">Arbeitsschuhe</a>
      <a href="https://sobral.ch/de/technische-produkte" target="_blank" rel="noopener" class="cat-link" data-i18n="nav_tech">Technische Produkte</a>
      <a href="https://sobral.ch/de/fallschutz" target="_blank" rel="noopener" class="cat-link" data-i18n="nav_fall">Fallschutz</a>
      <a href="https://sobral.ch/de/markenkompetenz" target="_blank" rel="noopener" class="cat-link" data-i18n="nav_brands">Markenkompetenz</a>
      <span class="cat-link-highlight" data-i18n="nav_studio">3D Custom Studio</span>
    </div>
  </nav>

  <!-- On-Page Dedicated Product Creation Screen -->
  <div id="product-creation-view" class="creation-screen-container"></div>

  <!-- Main Workspace -->
  <main class="app-layout">
    <!-- 3D Scene Viewport -->
    <section class="viewport-area">
      <div id="canvas-container"></div>
      
      <div class="view-instructions-hint">
        <span class="hint-icon-svg" id="icon-crosshair"></span>
        <span id="viewport-hint-text">Linksklick: 360° Drehen • Texte & Logos mit der Maus ziehen • Mausrad: Zoom</span>
      </div>

      <div id="view-controls-root"></div>
    </section>

    <!-- Configurator Sidebar -->
    <aside class="sidebar-panel">
      <!-- Tabs Nav -->
      <nav class="config-tabs">
        <button class="tab-btn active" data-tab="colors" id="tab-btn-colors">
          <span class="tab-icon" id="tab-icon-colors"></span>
          <span id="tab-label-colors">Farben & Stil</span>
        </button>
        <button class="tab-btn" data-tab="text" id="tab-btn-text">
          <span class="tab-icon" id="tab-icon-text"></span>
          <span id="tab-label-text">Text & Nummer</span>
        </button>
        <button class="tab-btn" data-tab="logos" id="tab-btn-logos">
          <span class="tab-icon" id="tab-icon-logos"></span>
          <span id="tab-label-logos">Logos</span>
        </button>
      </nav>

      <!-- Active Tab Container -->
      <div class="tab-content-container" id="tab-content-root"></div>
    </aside>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>

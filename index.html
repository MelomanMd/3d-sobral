<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEIN KOMPLETT-OUTFIT | SOBRAL 3D-Konfigurator</title>
  <meta name="description" content="Interaktiver 3D-Konfigurator für Arbeitskleidung und Workwear.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/styles/main.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ff4400' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z'/></svg>">
</head>
<body class="sobral-theme-2026">

  <!-- Background Store Simulation (for modal backdrop) -->
  <div class="shop-background-backdrop"></div>

  <!-- On-Page Dedicated Product Creation Screen (Modal/Overlay) -->
  <div id="product-creation-view" class="creation-screen-container hidden" style="display: none;"></div>

  <!-- 3D Configurator Main Modal Window (Figma: Overlay 1280x820) -->
  <div class="configurator-modal-backdrop" id="configurator-modal-backdrop">
    <div class="configurator-modal-window" id="configurator-modal-window">
      
      <!-- Left: 3D Scene Viewport -->
      <section class="viewport-area">
        <!-- Background Stencil Logo Watermark -->
        <div class="stage-watermark">
          <img src="./images/sobral-workwear-logo.svg" alt="Sobral Workwear" class="stage-watermark-logo">
        </div>

        <!-- Top-Left Branding HUD -->
        <div class="stage-hud-top-left">
          <div class="hud-brand-badge">
            <img src="./images/sobral-workwear-logo.svg" alt="Sobral Workwear" class="hud-sobral-logo" onerror="this.outerHTML='<span class=\'hud-logo-text\'>SOBRAL WORKWEAR</span>'">
          </div>
          <div class="hud-brand-text">
            <span class="hud-title-main">DEIN LOOK.</span>
            <span class="hud-title-sub">3D-KONFIGURATOR</span>
          </div>
        </div>

        <!-- Top-Right Action HUD: Close Button + Switch Product + Undo/Redo -->
        <div class="stage-hud-top-right">
          <button class="btn-stage-close" id="btn-stage-close" title="Konfigurator schließen" aria-label="Schließen">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
          <button class="btn-hud-change-product-figma" id="btn-change-product" title="Anderes Produkt auswählen">
            Produkt wechseln
          </button>
          <button class="btn-hud-action-sq desktop-only" id="btn-undo" title="Rückgängig (Ctrl + Z)" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 00-9-9 9 9 0 00-6 2.3L3 13"/></svg>
          </button>
          <button class="btn-hud-action-sq desktop-only" id="btn-redo" title="Wiederholen (Ctrl + Y)" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 019-9 9 9 0 016 2.3l3 2.7"/></svg>
          </button>
        </div>

        <!-- 3D Canvas -->
        <div id="canvas-container"></div>

        <!-- Bottom-Right Floating Stage Actions: AI Preview + Fullscreen 3D -->
        <div class="stage-hud-bottom-right" id="stage-hud-bottom-right">
          <button class="btn-hud-ai-generate" id="btn-ai-generate" title="Realistisches KI-Modell (Foto & Video) generieren">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8L20 10.7l-6.1 1.9L12 18.4l-1.9-5.8L4 10.7l6.1-1.9L12 3z"/></svg>
            <span>KI-MODELL</span>
          </button>
          <button class="btn-hud-fullscreen-stage" id="btn-fullscreen-stage" title="3D-Bühne vergrößern / verkleinern">
            <svg class="icon-expand" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
            <svg class="icon-collapse" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M10 14L3 21"/></svg>
            <span class="fs-text">3D VOLLBILD</span>
          </button>
        </div>

        <!-- Floating Camera Controls Root (Bottom-Center) -->
        <div id="view-controls-root"></div>
      </section>

      <!-- Right: Configurator Sidebar (Figma White Light Theme) -->
      <aside class="sidebar-panel">
        <!-- Sidebar Header with Close Button -->
        <div class="sidebar-header-new">
          <div class="sidebar-title-group">
            <h2 class="sidebar-title-main">DEIN KOMPLETT-OUTFIT</h2>
            <p class="sidebar-title-sub">Produkte zusammenstellen und personalisieren</p>
          </div>
          <button class="btn-sidebar-close" id="btn-close-configurator" title="Konfigurator schließen">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

        <!-- Stepper Navigation (3 Steps from Figma) -->
        <nav class="config-stepper">
          <button class="stepper-tab active" data-tab="colors" id="tab-btn-colors">
            <span class="stepper-label desktop-label">ELEMENTE & FARBEN</span>
            <span class="stepper-label mobile-label">Elemente & Farben</span>
          </button>
          <button class="stepper-tab" data-tab="text" id="tab-btn-text">
            <span class="stepper-label desktop-label">BESCHRIFTUNG</span>
            <span class="stepper-label mobile-label">Beschriftung</span>
          </button>
          <button class="stepper-tab" data-tab="logos" id="tab-btn-logos">
            <span class="stepper-label desktop-label">LOGO UPLOAD</span>
            <span class="stepper-label mobile-label">Logo</span>
          </button>
        </nav>

        <!-- Active Tab Container -->
        <div class="tab-content-container" id="tab-content-root"></div>

        <!-- Persistent Sidebar Footer Actions (Figma 3-button layout on desktop, 2-button on mobile) -->
        <div class="sidebar-footer-new">
          <button class="btn-footer-download desktop-only" id="btn-sidebar-download" title="Direkter Download">
            DOWNLOAD
          </button>
          <button class="btn-footer-draft" id="btn-sidebar-export" title="Entwurf speichern & Spezifikationen">
            <span class="desktop-label">ENTWURF SPEICHERN</span>
            <span class="mobile-label">Speichern</span>
          </button>
          <button class="btn-footer-quote desktop-only" id="btn-sidebar-quote" title="Unverbindliches Angebot anfordern">
            ANGEBOT ANFORDERN
          </button>
          <button class="btn-footer-next mobile-only" id="btn-mobile-next-step" title="Nächster Schritt">
            Weiter: Beschriftung
          </button>
        </div>
      </aside>

    </div>
  </div>

  <!-- Hidden container for compatibility with catalog/switcher -->
  <div id="product-switcher-root" style="display: none;"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
